<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src http://127.0.0.1:*; frame-src http://127.0.0.1:47823">
<meta name="color-scheme" content="light dark">
<title>Zack dev. dashboard</title>
<link rel="icon" href="data:,">
<style>
/* Tokens: black and white, one accent that means "needs an answer". */
:root {
  --bg: #ffffff; --fg: #0a0a0a; --muted: #595959; --line: #d6d6d6;
  --accent: #c8370a; --accent-fg: #ffffff;
  --display: "Helvetica Neue", "Arial Black", Arial, "Segoe UI", system-ui, "Microsoft JhengHei", "PingFang HK", sans-serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft JhengHei", "PingFang HK", "Noto Sans CJK TC", sans-serif;
  --mono: ui-monospace, "Cascadia Mono", "SFMono-Regular", Consolas, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0a0a; --fg: #f2f2f2; --muted: #a6a6a6; --line: #2f2f2f;
    --accent: #ff6a33; --accent-fg: #0a0a0a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0a0a; --fg: #f2f2f2; --muted: #a6a6a6; --line: #2f2f2f;
  --accent: #ff6a33; --accent-fg: #0a0a0a; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; overflow-x: clip; }
body { background: var(--bg); color: var(--fg); font: 16px/1.55 var(--body); }
a { color: inherit; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
[hidden] { display: none !important; }
.skip { position: absolute; left: -9999px; }
.skip:focus { left: 16px; top: 16px; z-index: 20; background: var(--bg); padding: 8px 12px; border: 1.5px solid var(--fg); }

.app { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100vh; }
.topbar { display: none; }
.sidebar {
  position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 28px 22px;
  border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 26px;
}
.brand { font: 800 1.5rem/1.02 var(--display); letter-spacing: -0.03em; }
.label, .meta, .tag { font-family: var(--mono); font-size: .74rem; letter-spacing: .06em; }
.label { text-transform: uppercase; display: block; margin-bottom: 6px; }
.meta { color: var(--muted); overflow-wrap: anywhere; }
#nav a {
  display: flex; justify-content: space-between; gap: 8px; padding: 8px 0;
  border-bottom: 1px solid var(--line); text-decoration: none; font-weight: 600;
}
#nav a[aria-current="page"] { font-weight: 800; }
#nav a[aria-current="page"]::before { content: "→ "; }
.side-block { display: grid; gap: 8px; }
.side-block p { margin: 0; font-size: .9rem; }
.side-block ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: .9rem; }
.side-tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; }

main { padding: 36px clamp(16px, 4vw, 60px) 96px; min-width: 0; max-width: 1120px; overflow-wrap: anywhere; }
main:focus { outline: none; }
h1 { font: 800 clamp(2.1rem, 6vw, 3.6rem)/1 var(--display); letter-spacing: -0.035em; margin: 6px 0 14px; }
h2 {
  font: 800 1.3rem/1.2 var(--display); letter-spacing: -0.01em;
  margin: 44px 0 6px; padding-top: 12px; border-top: 2px solid var(--fg);
}
.lead { font-size: 1.05rem; max-width: 62ch; margin: 0 0 22px; }
.muted { color: var(--muted); }
.strong { font-weight: 700; }
.pre { white-space: pre-wrap; }

button {
  font: 600 .9rem/1.1 var(--body); padding: 10px 14px; min-height: 40px; cursor: pointer;
  border: 1.5px solid var(--fg); border-radius: 0; background: transparent; color: var(--fg);
}
button:hover:not(:disabled), button.primary { background: var(--fg); color: var(--bg); }
button.primary:hover:not(:disabled) { background: transparent; color: var(--fg); }
button:disabled { opacity: .4; cursor: not-allowed; }
button.small { min-height: 32px; padding: 6px 10px; font-size: .8rem; }
input[type="text"], input[type="search"], input[type="password"], input[type="number"], textarea, select {
  width: 100%; max-width: 100%; font: inherit; color: var(--fg); background: var(--bg);
  border: 1.5px solid var(--fg); border-radius: 0; padding: 10px 12px;
}
textarea { resize: vertical; min-height: 84px; }
input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--fg); margin: 0; }

.band {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
  padding: 12px 16px; margin-bottom: 30px; border: 1.5px solid var(--fg);
}
.band.needs { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.band .q { flex: 1 1 240px; min-width: 0; }
.band a { font-weight: 800; white-space: nowrap; }
.tag { text-transform: uppercase; border: 1px solid currentColor; padding: 2px 6px; white-space: nowrap; display: inline-block; }
.tag.needs { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.tag.on { background: var(--fg); color: var(--bg); }
.count { font-family: var(--mono); font-size: .74rem; padding: 1px 7px; }
.count.needs { background: var(--accent); color: var(--accent-fg); }

.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.panel { border: 1.5px solid var(--fg); padding: 16px; display: grid; gap: 10px; margin: 8px 0 12px; }
.panel p { margin: 0; }
.card { border-top: 1px solid var(--line); padding: 18px 0; display: grid; gap: 10px; }
.card.needs { border-left: 4px solid var(--accent); padding-left: 16px; }
.qtext { font-weight: 700; font-size: 1.12rem; line-height: 1.4; }
.note { border-left: 2px solid var(--fg); padding-left: 10px; }
.list { list-style: none; margin: 0; padding: 0; }
.item {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px;
  padding: 12px 0; border-top: 1px solid var(--line);
}
.item .title { font-weight: 700; flex: 1 1 200px; min-width: 0; }
.item .desc, .item .path { flex-basis: 100%; min-width: 0; }
.item .path { font-family: var(--mono); font-size: .78rem; color: var(--muted); }
.item.done .title { text-decoration: line-through; color: var(--muted); }
.check { display: flex; gap: 10px; align-items: center; flex: 1 1 200px; min-width: 0; }
.filter { display: grid; gap: 4px; max-width: 420px; margin: 14px 0 6px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 8px 40px; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 14px; margin: 14px 0; }
.field { display: grid; gap: 4px; align-content: start; }
.log {
  font-family: var(--mono); font-size: .82rem; border: 1.5px solid var(--fg); padding: 10px 12px;
  min-height: 120px; max-height: 60vh; overflow-y: auto; overflow-x: hidden; margin-top: 8px;
}
.log .line { display: grid; grid-template-columns: 6.5em minmax(0, 1fr); gap: 10px; padding: 5px 0; border-bottom: 1px dashed var(--line); }
.log .line .label { margin: 0; color: var(--muted); }
.log .line .text { white-space: pre-wrap; overflow-wrap: anywhere; }
.log .line.message .text { font-family: var(--body); font-size: .95rem; }
.log .line.error .text { font-weight: 700; }
.board { display: block; width: 100%; height: calc(100vh - 220px); min-height: 70vh; margin-top: 8px; border: 1.5px solid var(--fg); background: var(--bg); }

#message {
  position: fixed; left: 16px; right: 16px; bottom: 16px; z-index: 30; margin: 0 auto; max-width: 560px;
  background: var(--fg); color: var(--bg); padding: 12px 16px; font-weight: 600; cursor: pointer;
}
#message.error { background: var(--bg); color: var(--fg); border: 2px solid var(--fg); }

@media (max-width: 767.98px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .topbar {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    position: sticky; top: 0; z-index: 10; padding: 10px 16px;
    background: var(--bg); border-bottom: 1px solid var(--line);
  }
  .topbar .brand { font-size: 1.15rem; }
  .sidebar { display: none; position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 16px; }
  .sidebar.open { display: flex; }
  .sidebar > .brand, .sidebar > .brand-sub { display: none; }
  main { padding: 22px 16px 96px; }
}
@media (max-width: 480px) {
  .log .line { grid-template-columns: minmax(0, 1fr); gap: 0; }
}
</style>
</head>

<a class="skip" href="#main" data-t="skip">Skip to content</a>
<div class="app">
  <header class="topbar">
    <span class="brand" id="topName"></span>
    <button type="button" id="menuBtn" aria-expanded="false" aria-controls="sidebar" data-t="menu">Menu</button>
  </header>
  <aside class="sidebar" id="sidebar">
    <div class="brand" id="brandName"></div>
    <div class="meta brand-sub" data-t="brand.sub">Questions, tasks and notes</div>
    <nav id="nav" data-t-aria="nav.aria"></nav>
    <section class="side-block">
      <span class="label" data-t="side.data">Data</span>
      <p id="sourceStatus" role="status"></p>
      <button type="button" id="connectBtn" data-t="data.connect">Connect folder</button>
      <button type="button" id="reconnectBtn" hidden></button>
      <button type="button" id="reloadBtn" hidden data-t="data.reload">Reload from folder</button>
      <p id="noApiNote" class="meta" hidden data-t="data.noApi"></p>
    </section>
    <section class="side-block">
      <span class="label" data-t="side.links">Links</span>
      <ul id="sideLinks"></ul>
    </section>
    <div class="side-tools">
      <button type="button" class="small" id="langBtn" data-t-aria="lang.aria"></button>
      <button type="button" class="small" id="themeBtn"></button>
    </div>
  </aside>
  <main id="main" tabindex="-1">
    <div id="band" class="band"></div>
    <div id="page"></div>
    <iframe id="boardFrame" class="board" hidden></iframe>
  </main>
</div>
<div id="message" role="status" aria-live="polite" hidden></div>
<input type="file" id="fileQuestions" accept=".json,application/json" hidden>
<input type="file" id="fileSnapshot" accept=".json,application/json" hidden>
<input type="file" id="fileBackup" accept=".json,application/json" hidden>

// ===== Pure helpers (tested without a browser). =====
const PROJECTS = ['PCB', 'DATASET', 'Research', 'Library', 'General'];
const STATUSES = ['open', 'answered', 'used'];
const Q_TEXT_FIELDS = ['task', 'asked_by', 'asked_at', 'answer', 'answered_at', 'used_by', 'used_at', 'used_note'];
const BACKUP_KIND = 'zack-dev-dashboard-notes';
const NOTES_KEY = 'zdd.notes';
const isObj = (v) => v !== null && typeof v === 'object' && !Array.isArray(v);
const isStr = (v) => typeof v === 'string';
const ts = (v) => { const n = Date.parse(v); return Number.isNaN(n) ? 0 : n; };
const clip = (s, n, tail) => (s.length <= n ? s : tail ? '…' + s.slice(-n) : s.slice(0, n) + '…');

let lang = 'en';
function t(key, vars) {
  let s = (TEXT[lang] && TEXT[lang][key]) || TEXT.en[key] || key;
  if (vars) s = s.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? String(vars[k]) : m));
  return s;
}
// A data value (status, kind, project) in the reader's language; one the table lacks is shown as it is.
function word(prefix, value) {
  return Object.hasOwn(TEXT.en, prefix + value) ? t(prefix + value) : String(value);
}

// Each validator returns null when the document is good, or where it first goes wrong.
function validateQuestions(d) {
  if (!isObj(d)) return '$';
  if (d.version !== 1) return 'version';
  if (!Array.isArray(d.questions)) return 'questions';
  const seen = new Set();
  for (let i = 0; i < d.questions.length; i++) {
    const q = d.questions[i], at = `questions[${i}]`;
    if (!isObj(q)) return at;
    if (!isStr(q.id) || !q.id || seen.has(q.id)) return at + '.id';
    seen.add(q.id);
    if (!PROJECTS.includes(q.project)) return at + '.project';
    if (!isStr(q.question) || !q.question.trim()) return at + '.question';
    if (!STATUSES.includes(q.status)) return at + '.status';
    for (const f of Q_TEXT_FIELDS) if (f in q && !isStr(q[f])) return `${at}.${f}`;
  }
  return null;
}

function validateSnapshot(d) {
  if (!isObj(d)) return '$';
  if (d.version !== 1) return 'version';
  if ('generated_at' in d && !isStr(d.generated_at)) return 'generated_at';
  if (!isObj(d.projects)) return 'projects';
  for (const [name, items] of Object.entries(d.projects)) {
    if (!Array.isArray(items)) return `projects.${name}`;
    for (let i = 0; i < items.length; i++) {
      const it = items[i], at = `projects.${name}[${i}]`;
      if (!isObj(it)) return at;
      if (!isStr(it.title)) return at + '.title';
      if (!isStr(it.status)) return at + '.status';
      if ('file' in it && !isStr(it.file)) return at + '.file';
      if ('line' in it && it.line !== null && !(Number.isInteger(it.line) && it.line >= 0)) return at + '.line';
    }
  }
  if (!isObj(d.library)) return 'library';
  if ('count' in d.library && !Number.isInteger(d.library.count)) return 'library.count';
  if (!Array.isArray(d.library.entries)) return 'library.entries';
  for (let i = 0; i < d.library.entries.length; i++) {
    const e = d.library.entries[i], at = `library.entries[${i}]`;
    if (!isObj(e)) return at;
    if (!isStr(e.name)) return at + '.name';
    for (const f of ['kind', 'collection', 'summary', 'path']) if (f in e && !isStr(e[f])) return `${at}.${f}`;
  }
  return null;
}

function validateBackup(d) {
  if (!isObj(d)) return '$';
  if (d.kind !== BACKUP_KIND) return 'kind';
  if (d.version !== 1) return 'version';
  for (const list of ['notes', 'todos']) {
    if (!Array.isArray(d[list])) return list;
    for (let i = 0; i < d[list].length; i++) {
      const n = d[list][i], at = `${list}[${i}]`;
      if (!isObj(n)) return at;
      if (!isStr(n.id)) return at + '.id';
      if (!isStr(n.text)) return at + '.text';
      if (list === 'todos' && typeof n.done !== 'boolean') return at + '.done';
      if ('created_at' in n && !isStr(n.created_at)) return at + '.created_at';
    }
  }
  return null;
}

// Returns a new document with one question answered; every other byte of data is kept.
function applyAnswer(doc, id, text, now) {
  const answer = String(text || '').trim();
  if (!answer) return { error: 'err.empty' };
  const next = structuredClone(doc);
  const q = next.questions.find((x) => x.id === id);
  if (!q) return { error: 'err.noQuestion' };
  if (q.status === 'used') return { error: 'err.used' };
  q.status = 'answered'; q.answer = answer; q.answered_at = now;
  return { doc: next };
}

function splitQuestions(doc) {
  const newest = (f) => (a, b) => ts(b[f]) - ts(a[f]);
  const qs = doc.questions;
  return {
    open: qs.filter((q) => q.status === 'open').sort(newest('asked_at')),
    answered: qs.filter((q) => q.status === 'answered').sort(newest('answered_at')),
    used: qs.filter((q) => q.status === 'used').sort(newest('used_at')),
  };
}

function matches(obj, fields, query) {
  const q = String(query || '').trim().toLowerCase();
  return !q || fields.some((f) => String(obj[f] ?? '').toLowerCase().includes(q));
}

// One readable log line per bridge event ({ method, params }); null for events not worth a line.
function eventLine(e) {
  if (!isObj(e) || !isStr(e.method)) return null;
  const p = isObj(e.params) ? e.params : {};
  const it = isObj(p.item) ? p.item : {};
  switch (e.method) {
    case 'item/started': return it.type === 'commandExecution' ? { kind: 'command', text: '$ ' + String(it.command ?? '') } : null;
    case 'item/completed': return it.type === 'userMessage' ? null : itemLine(it); // the page logged the prompt itself
    case 'turn/completed': {
      const turn = isObj(p.turn) ? p.turn : {};
      if (turn.status === 'interrupted') return { kind: 'exit', text: t('log.interrupted') };
      if (turn.status === 'failed') return { kind: 'error', text: String((isObj(turn.error) && turn.error.message) || t('log.failed')) };
      return { kind: 'done', text: t('log.done') };
    }
    case 'bridge/declined': return { kind: 'error', text: t('log.declined', { request: String(p.request ?? '?') }) };
    case 'error': return { kind: 'error', text: String((isObj(p.error) && p.error.message) || t('log.failed')) };
  }
  return null;
}

// One readable log line per item of a Codex thread, as the app-server names them.
function itemLine(it) {
  const s = (v) => String(v ?? '');
  const list = (v) => (Array.isArray(v) ? v : []);
  switch (it.type) {
    case 'userMessage': return { kind: 'you', text: list(it.content).map((c) => s(c && c.text)).join('\n') };
    case 'agentMessage': return { kind: 'message', text: s(it.text) };
    case 'reasoning': { const text = list(it.summary).map(s).join('\n').trim(); return text ? { kind: 'reasoning', text } : null; }
    case 'plan': return { kind: 'todo', text: s(it.text) };
    case 'commandExecution': {
      const out = clip(s(it.aggregatedOutput).trimEnd(), 1500, true);
      return { kind: 'command', text: t('log.command', { cmd: s(it.command), code: it.exitCode ?? '?' }) + (out ? '\n' + out : '') };
    }
    case 'fileChange':
      return { kind: 'file', text: list(it.changes).map((c) => `${s(isObj(c && c.kind) ? c.kind.type : c && c.kind)} ${s(c && c.path)}`).join('\n') };
    case 'mcpToolCall': return { kind: 'tool', text: `${s(it.server)}.${s(it.tool)} ${s(it.status)}`.trim() };
    case 'webSearch': return { kind: 'search', text: s(it.query) };
  }
  return { kind: 'event', text: s(it.type || '?') };
}

// Browser storage can be missing or throw (private windows, blocked site data).
function store(area) {
  return {
    get(key) { try { return window[area].getItem(key); } catch { return null; } },
    set(key, value) { try { window[area].setItem(key, value); return true; } catch { return false; } },
  };
}

function loadNotes() {
  try {
    const d = JSON.parse(store('localStorage').get(NOTES_KEY) || 'null');
    if (validateBackup(d) === null) return d;
  } catch { /* unreadable notes start empty */ }
  return { kind: BACKUP_KIND, version: 1, notes: [], todos: [] };
}

// ===== DOM helpers: text only ever goes in as text nodes. =====
const $ = (id) => document.getElementById(id);
function el(tag, props, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'on') for (const [ev, fn] of Object.entries(v)) n.addEventListener(ev, fn);
    else if (k === 'data') Object.assign(n.dataset, v);
    else if (k === 'role' || k.includes('-')) n.setAttribute(k, v);
    else n[k] = v;
  }
  n.append(...kids.flat().filter((k) => k != null && k !== false).map((k) => (typeof k === 'object' ? k : String(k))));
  return n;
}
function fmtTime(v) {
  const d = new Date(v);
  return v && !Number.isNaN(d.getTime()) ? d.toLocaleString(lang, { dateStyle: 'medium', timeStyle: 'short' }) : (v || '—');
}
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const errText = (err, file) => (err && err.name === 'NotFoundError' && file ? t('err.missing', { file }) : String((err && err.message) || err));

let sayTimer = null;
function say(text, isError) {
  const box = $('message');
  clearTimeout(sayTimer);
  box.textContent = text || '';
  box.hidden = !text;
  box.classList.toggle('error', !!isError);
  if (text && !isError) sayTimer = setTimeout(() => { box.hidden = true; }, 6000);
}

function download(name, data) {
  const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2) + '\n'], { type: 'application/json' }));
  const a = el('a', { href: url, download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function parseChecked(text, file, validate) {
  let doc;
  try { doc = JSON.parse(text); } catch { throw new Error(t('err.json', { file })); }
  const where = validate(doc);
  if (where) throw new Error(t('err.invalid', { file, where }));
  return doc;
}

async function saveAnswer(id, text) {
  const now = new Date().toISOString();
  try {
    if (state.dir && !state.qSample) {
      // Re-read the file first so questions agents added since the last load are kept.
      const fh = await state.dir.getFileHandle('questions.json');
      const current = parseChecked(await (await fh.getFile()).text(), 'questions.json', validateQuestions);
      const r = applyAnswer(current, id, text, now);
      if (r.error) return say(t(r.error), true);
      const w = await fh.createWritable();
      await w.write(JSON.stringify(r.doc, null, 2) + '\n');
      await w.close();
      state.questions = r.doc;
      say(t('q.savedFolder'));
    } else {
      // Sample questions may be answered to try the page; such answers stay here and are never kept.
      const r = applyAnswer(state.questions, id, text, now);
      if (r.error) return say(t(r.error), true);
      Object.assign(state, { questions: r.doc, dirty: !state.qSample });
      say(t(state.qSample ? 'q.savedSample' : 'q.savedMemory'));
    }
    delete state.drafts[id];
    renderAll();
  } catch (err) { say(errText(err, 'questions.json'), true); }
}

async function importFile(input, kind) {
  const file = input.files && input.files[0];
  input.value = '';
  if (!file) return;
  try {
    if (kind === 'questions') {

      if (state.dirty && !confirm(t('data.discardConfirm'))) return;
      Object.assign(state, { questions: doc, qSample: false, dirty: false });
    } else {
      Object.assign(state, { snapshot: parseChecked(await file.text(), file.name, validateSnapshot), sSample: false });
    }
    renderAll();
    say(t('files.imported', { file: file.name }));
  } catch (err) { say(errText(err), true); }
}

// ===== Folder access (Chrome and Edge), the handle kept in IndexedDB =====
function idb(mode, op) {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) return resolve(null);
    const req = indexedDB.open('zack-dev-dashboard', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('handles');
    req.onerror = () => reject(req.error);
    req.onsuccess = () => {
      const db = req.result, tx = db.transaction('handles', mode), r = op(tx.objectStore('handles'));
      tx.oncomplete = () => { db.close(); resolve(r.result); };
      tx.onerror = () => { db.close(); reject(tx.error); };
    };
  });
}

async function connectFolder() {
  if (state.dirty && !confirm(t('data.discardConfirm'))) return;
  try {
    const dir = await window.showDirectoryPicker({ id: 'zack-dashboard', mode: 'readwrite' });
    Object.assign(state, { dir, storedDir: dir });
    try { await idb('readwrite', (s) => s.put(dir, 'folder')); } catch { /* remembering is a convenience */ }
    await loadFromFolder(true);
  } catch (err) { if (!err || err.name !== 'AbortError') say(errText(err), true); }
}

async function reconnectFolder() {
  const dir = state.storedDir;
  if (!dir) return;
  if (state.dirty && !confirm(t('data.discardConfirm'))) return;
  try {
    if (await dir.requestPermission({ mode: 'readwrite' }) !== 'granted') return say(t('data.denied'), true);
    state.dir = dir;
    await loadFromFolder(true);
  } catch (err) { say(errText(err), true); }
}

async function restoreFolder() {
  try {
    const dir = await idb('readonly', (s) => s.get('folder'));
    if (!dir || typeof dir.queryPermission !== 'function') return;
    state.storedDir = dir;
    if (await dir.queryPermission({ mode: 'readwrite' }) === 'granted') { state.dir = dir; await loadFromFolder(false); } else renderAll();
  } catch { /* no remembered folder */ }
}

async function loadFromFolder(announce) {
  const dir = state.dir;
  if (!dir) return;
  const problems = [];
  const read = async (name, validate) => {
    try {
      const fh = await dir.getFileHandle(name);
      return parseChecked(await (await fh.getFile()).text(), name, validate);
    } catch (err) { problems.push(errText(err, name)); return null; }
  };
  const q = await read('questions.json', validateQuestions);
  const s = await read('snapshot.json', validateSnapshot);
  if (q) Object.assign(state, { questions: q, qSample: false, dirty: false });
  if (s) Object.assign(state, { snapshot: s, sSample: false });
  renderAll();
  if (problems.length) say(problems.join(' '), true);
  else if (announce) say(t('data.loaded', { name: dir.name }));
}

// ===== Codex panel, through codex-bridge.mjs on 127.0.0.1 =====
const base = () => 'http://127.0.0.1:' + codex.port;
const bridgeError = (msg) => Object.assign(new Error(msg), { bridge: true });
const sayErr = (err) => say(err.bridge ? err.message : t('codex.unreachable'), true);

async function bridge(path, body) {
  const headers = { 'X-Bridge-Key': codex.key };
  if (body !== undefined) headers['Content-Type'] = 'application/json';
  const res = await fetch(base() + path, { method: body === undefined ? 'GET' : 'POST', headers, cache: 'no-store',
    body: body === undefined ? undefined : JSON.stringify(body) });
  if (res.status === 401) throw bridgeError(t('codex.badKey'));
  if (!res.ok) throw bridgeError(String((await res.json().catch(() => ({}))).error || '') || t('codex.httpError', { status: res.status }));
  try { return await res.json(); } catch { throw bridgeError(t('codex.badReply')); }
}
async function checkBridge() {
  try {
    const h = await bridge('/health');
    if (!isObj(h) || h.ok !== true || !isObj(h.appServer)) throw bridgeError(t('codex.badReply'));
    if (!h.appServer.up) throw bridgeError(t('codex.appServerDown', { error: String(h.appServer.error ?? '?') }));
    const version = (String(h.appServer.userAgent ?? '').match(/\/(\d+\.\d+\.\d+)/) || [])[1];
    codex.health = { ok: true, text: t('codex.connected', { folder: String(h.folder ?? '?'), codex: version ? 'Codex ' + version : String(h.codex ?? '?') }) };
    openStream();
    await Promise.all([loadAccount(), loadThreads()]);
  } catch (err) {
    codex.health = { ok: false, bridge: !!err.bridge, text: err.bridge ? err.message : t('codex.unreachable') };
  }
  renderAll();
}
async function loadAccount() { const a = await bridge('/account'); codex.account = isObj(a) ? a : null; }
async function loadThreads() { const r = await bridge('/threads'); codex.threads = isObj(r) && Array.isArray(r.threads) ? r.threads.filter((x) => isObj(x) && isStr(x.id)) : []; }
async function loadView(id) { const v = await bridge('/thread?id=' + encodeURIComponent(id)); codex.view = isObj(v) && isStr(v.id) && Array.isArray(v.turns) ? v : null; }
async function openThread(id) { try { await loadView(id); codex.thread = id; } catch (err) { sayErr(err); } renderAll(); }

// Lists and the opened thread repaint in place, so typing in the prompt is never lost.
const paint = (id, kids) => { const box = $(id); if (box) box.replaceChildren(...kids); };
let refreshTimer = null;
function refreshSoon() {
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(async () => {
    try { await loadThreads(); if (codex.view) await loadView(codex.view.id); } catch { /* the next refresh tries again */ }
    paint('codexThreads', threadKids()); paint('codexView', viewKids()); updateCodexControls();
  }, 400);
}
const refreshAccount = () => loadAccount().then(() => paint('codexAccount', accountKids())).catch(() => {});

// The event stream reads with fetch, so the key goes in a header and never in an address.
async function openStream() {
  if (codex.stream) return;
  const ctrl = new AbortController(); codex.stream = ctrl;
  // Work in other Codex windows sends no events here, so the list also refreshes every 15 s.
  codex.poll = setInterval(() => { if (route === 'codex' && document.visibilityState === 'visible') refreshSoon(); }, 15000);
  codex.poll.unref?.();
  try {
    const res = await fetch(base() + '/events', { headers: { 'X-Bridge-Key': codex.key }, cache: 'no-store', signal: ctrl.signal });
    if (!res.ok || !res.body) throw new Error(String(res.status));
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      for (let cut = buf.indexOf('\n\n'); cut >= 0; cut = buf.indexOf('\n\n')) {
        for (const line of buf.slice(0, cut).split('\n')) if (line.startsWith('data: ')) onEvent(line.slice(6));
        buf = buf.slice(cut + 2);
      }
    }
  } catch { /* closed or refused: said below */ }
  if (codex.stream !== ctrl) return;
  clearInterval(codex.poll); codex.stream = null;
  // Events missed from here on are lost, so a running turn's state is unknown.
  if (!ctrl.signal.aborted) { addLog({ kind: 'error', text: t('codex.streamLost') }); if (codex.running) endRun(); }
}
// A new port or key is a new bridge: the old stream and its run belong to the old one.
function dropStream() { codex.stream?.abort(); clearInterval(codex.poll); Object.assign(codex, { stream: null, running: null, health: null }); }
function onEvent(data) { let evt; try { evt = JSON.parse(data); } catch { return; } if (isObj(evt) && isStr(evt.method)) handleEvent(evt); }
const turnOf = (p) => p.turnId ?? (isObj(p.turn) ? p.turn.id : undefined);
function handleEvent(evt) {
  const p = isObj(evt.params) ? evt.params : {};
  if (codex.starting) codex.early.push(evt); // replayed once the run reply names its turn
  const r = codex.running;
  const mine = r && p.threadId === r.thread && [undefined, r.turn].includes(turnOf(p));
  if (mine || evt.method === 'bridge/declined') { const line = eventLine(evt); if (line) addLog(line); }
  if (mine && evt.method === 'turn/completed') endRun();
  if (evt.method === 'bridge/appServer' && !p.up && r) { addLog({ kind: 'error', text: t('codex.appServerLost', { error: String(p.error ?? '?') }) }); endRun(); }
  if (evt.method === 'account/login/completed') {
    say(p.success ? t('codex.signInDone') : t('codex.signInFailed', { error: String(p.error ?? '?') }), !p.success);
    refreshAccount();
  } else if (evt.method === 'account/updated' || evt.method === 'account/rateLimits/updated') refreshAccount();
  if (/^(thread\/(started|status\/changed)|turn\/completed)$/.test(evt.method)) refreshSoon();
}
const logLine = (l) => el('div', { class: 'line ' + l.kind }, el('span', { class: 'label' }, t('kind.' + l.kind)), el('span', { class: 'text' }, l.text));
function addLog(line) {
  codex.log.push(line);
  if (codex.log.length > 1000) codex.log.shift(); // ponytail: a plain cap; the bridge keeps no history either
  const box = $('codexLog');
  if (box) { box.append(logLine(line)); box.scrollTop = box.scrollHeight; }
}

async function runCodex() {
  const prompt = codex.prompt.trim();
  if (!prompt) return say(t('codex.noPrompt'), true);
  if (codex.running || codex.starting) return;
  // Held from the first click, so a second click before the reply sends nothing.
  Object.assign(codex, { starting: true, early: [] });
  updateCodexControls();
  openStream();
  try {
    const sandbox = codex.sandbox;
    const r = await bridge('/run', { prompt, sandbox, thread: codex.thread || null });
    if (!isObj(r) || !isStr(r.thread) || !isStr(r.turn)) throw bridgeError(t('codex.badReply'));
    Object.assign(codex, { running: { thread: r.thread, turn: r.turn }, thread: r.thread, sandbox: 'read-only', prompt: '', starting: false });
    renderAll();
    addLog({ kind: 'you', text: prompt + (sandbox === 'read-only' ? '' : `  [${sandbox}]`) });
    for (const evt of codex.early.splice(0)) handleEvent(evt); // the turn may have ended already
  } catch (err) { sayErr(err); }
  codex.starting = false;
  updateCodexControls();
}

function endRun() { codex.running = null; updateCodexControls(); refreshSoon(); }

async function stopCodex() {
  if (!codex.running) return;
  try { await bridge('/stop', codex.running); addLog({ kind: 'event', text: t('codex.stopping') }); } catch (err) { sayErr(err); }
}

async function signIn() {
  try {
    const r = await bridge('/login', {});
    if (!isObj(r) || !isStr(r.authUrl) || !/^https:\/\//.test(r.authUrl)) throw bridgeError(t('codex.badReply'));
    window.open(r.authUrl, '_blank', 'noopener');
    say(t('codex.signInOpened'));
  } catch (err) { sayErr(err); }
}

const titleOf = (th) => clip(String(th.name || th.preview || th.id), 120);
const stateText = (s) => t('cstate.' + (['running', 'active-elsewhere', 'error'].includes(s) ? s : 'idle'));
const sourceText = (th) => (th.source === 'subAgent' ? [t('src.subAgent'), th.nickname].filter(Boolean).join(' ')
  : t('src.' + (['exec', 'cli', 'vscode', 'appServer'].includes(th.source) ? th.source : 'other')));
const windowText = (mins) => (mins % 1440 === 0 ? t('codex.windowDays', { n: mins / 1440 }) : t('codex.windowHours', { n: Math.round(mins / 60) }));

function accountKids() {
  const a = codex.account;
  if (!a) return [];
  const windows = isObj(a.rateLimits) ? [a.rateLimits.primary, a.rateLimits.secondary].filter(isObj) : [];
  return [el('div', { class: 'panel' },
    el('p', { class: 'strong' }, a.signedIn ? t('codex.signedIn', { type: String(a.type ?? '?'), plan: String(a.plan ?? '?') }) : t('codex.notSignedIn')),
    ...windows.map((w) => el('p', { class: 'meta' }, t('codex.quota', {
      window: windowText(Number(w.windowDurationMins) || 0), used: w.usedPercent ?? '?', when: w.resetsAt ? fmtTime(w.resetsAt * 1000) : '?' }))),
    a.signedIn ? null : el('div', { class: 'row' }, el('button', { type: 'button', class: 'primary', on: { click: signIn } }, t('codex.signIn'))))];
}

function threadKids() {
  if (!codex.threads.length) return [el('li', { class: 'item meta' }, t('codex.noThreads'))];
  return codex.threads.map((th) => el('li', { class: 'item' },
    el('span', { class: 'tag' + (th.state === 'running' || th.state === 'active-elsewhere' ? ' on' : '') }, stateText(th.state)),
    el('span', { class: 'title' }, titleOf(th)),
    el('button', { type: 'button', class: 'small', on: { click: () => openThread(th.id) } }, t('codex.open')),
    el('span', { class: 'path' }, [sourceText(th), th.cwd, th.updatedAt ? fmtTime(th.updatedAt * 1000) : ''].filter(Boolean).join(' · '))));
}

function viewKids() {
  const v = codex.view;
  if (!v) return [];
  const lines = v.turns.flatMap((turn) => (isObj(turn) && Array.isArray(turn.items) ? turn.items : []).filter(isObj).map(itemLine).filter(Boolean));
  return [
    el('h2', null, t('codex.threadTitle', { title: titleOf(v) })),
    el('p', { class: 'meta' }, [stateText(v.state), v.cwd, t('codex.lastTurns', { n: v.turns.length })].filter(Boolean).join(' · ')),
    lines.length ? el('div', { class: 'log' }, lines.map(logLine)) : el('p', { class: 'meta' }, t('codex.noTurns')),
  ];
}

function fillThreads(sel) {
  sel.replaceChildren(el('option', { value: '' }, t('codex.newThread')),
    ...codex.threads.map((th) => el('option', { value: th.id }, `${clip(titleOf(th), 60)} · ${stateText(th.state)}`)));
  sel.value = codex.threads.some((th) => th.id === codex.thread) ? codex.thread : '';
}

function updateCodexControls() {
  const run = $('codexRun'), stop = $('codexStop'), sel = $('codexThread'), status = $('codexStatus');
  if (run) run.disabled = !!(codex.running || codex.starting);
  if (stop) stop.disabled = !codex.running;
  if (sel) fillThreads(sel);
  if (status) status.textContent = codex.running ? t('codex.running', { thread: clip(codex.running.thread, 13) }) : '';
}

function renderCodex() {
  const field = (id, label, input, note) => el('div', { class: 'field' },
    el('label', { htmlFor: id, class: 'label' }, label), input, note ? el('span', { class: 'meta' }, note) : null);
  const port = el('input', { id: 'bridgePort', type: 'number', min: 1024, max: 65535, value: String(codex.port), on: { change: (e) => {
    const p = Number(e.target.value);
    if (Number.isInteger(p) && p >= 1024 && p <= 65535) { codex.port = p; store('localStorage').set('zdd.bridgePort', String(p)); dropStream(); }
    else { e.target.value = String(codex.port); say(t('codex.badPort'), true); }
  } } });
  // The key lives in this tab's storage only; the field never shows it again once set.
  const key = el('input', { id: 'bridgeKey', type: 'password', autocomplete: 'off', value: '', placeholder: codex.key ? t('codex.keySet') : '',
    on: { input: (e) => { codex.key = e.target.value.trim(); store('sessionStorage').set('zdd.bridgeKey', codex.key); dropStream(); } } });
  const thread = el('select', { id: 'codexThread', on: { change: (e) => { codex.thread = e.target.value; } } });
  fillThreads(thread);
  const sandbox = el('select', { id: 'codexSandbox', on: { change: (e) => {
    codex.sandbox = e.target.value === 'workspace-write' ? 'workspace-write' : 'read-only';
  } } }, el('option', { value: 'read-only' }, t('codex.readOnly')), el('option', { value: 'workspace-write' }, t('codex.workspaceWrite')));
  sandbox.value = codex.sandbox;
  const h = codex.health;
  return [
    el('h1', null, t('nav.codex')),
    el('p', { class: 'lead' }, t('codex.lead')),
    el('div', { class: 'fields' },
      field('bridgePort', t('codex.port'), port),
      field('bridgeKey', t('codex.key'), key, t('codex.keyNote'))),
    el('div', { class: 'row' }, el('button', { type: 'button', on: { click: checkBridge } }, t('codex.check'))),
    h ? el('p', { class: h.ok ? 'meta' : 'strong' }, h.text) : null,
    h && !h.ok && !h.bridge ? el('p', { class: 'meta' }, t('codex.howToStart')) : null,
    el('div', { id: 'codexAccount' }, accountKids()),
    ...(h && h.ok ? [
      el('h2', null, t('codex.activity')),
      el('p', { class: 'meta' }, t('codex.activityNote')),
      el('div', { class: 'row' }, el('button', { type: 'button', class: 'small', on: { click: refreshSoon } }, t('codex.refresh'))),
      el('ul', { id: 'codexThreads', class: 'list' }, threadKids()),
    ] : []),
    el('div', { id: 'codexView' }, viewKids()),
    el('div', { class: 'fields' },
      field('codexThread', t('codex.thread'), thread),
      field('codexSandbox', t('codex.sandbox'), sandbox, t('codex.sandboxNote'))),
    field('codexPrompt', t('codex.prompt'), el('textarea', { id: 'codexPrompt', rows: 4, value: codex.prompt,
      on: { input: (e) => { codex.prompt = e.target.value; } } })),
    el('div', { class: 'row' },
      el('button', { type: 'button', class: 'primary', id: 'codexRun', disabled: !!codex.running, on: { click: runCodex } }, t('codex.run')),
      el('button', { type: 'button', id: 'codexStop', disabled: !codex.running, on: { click: stopCodex } }, t('codex.stop')),
      el('button', { type: 'button', class: 'small', on: { click: () => { codex.log = []; renderAll(); } } }, t('codex.clear')),
      el('span', { class: 'meta', id: 'codexStatus', role: 'status' }, codex.running ? t('codex.running', { thread: clip(codex.running.thread, 13) }) : '')),
    el('h2', null, t('codex.log')),
    el('div', { id: 'codexLog', class: 'log', role: 'log', 'aria-live': 'polite' }, codex.log.map(logLine)),
  ];
}

// ===== Taskboard page: the local board, framed while the taskboard runs =====
const taskboardUrl = () => `http://127.0.0.1:${SETTINGS.taskboardPort}/`;
const board = { state: null }; // null until first checked, then 'checking', 'up' or 'down'

// A no-cors request resolves when anything answers on the port; its reply is opaque and never read.
async function boardAnswers(url) {
  try { await fetch(url, { mode: 'no-cors', cache: 'no-store', signal: AbortSignal.timeout(2000) }); return true; }
  catch { return false; }
}

async function checkBoard() {
  board.state = 'checking';
  renderAll();
  board.state = await boardAnswers(taskboardUrl()) ? 'up' : 'down';
  // Setting src (re)loads the board, which may have restarted since; renders never touch it.
  if (board.state === 'up') $('boardFrame').src = taskboardUrl();
  renderAll();
}

function renderTaskboard() {
  if (!board.state) { board.state = 'checking'; setTimeout(checkBoard); } // first visit: check outside this render
  const url = taskboardUrl();
  const again = el('button', { type: 'button', disabled: board.state === 'checking', on: { click: checkBoard } }, t('board.check'));
  return [
    el('h1', null, t('nav.taskboard')),
    el('p', { class: 'lead' }, t('board.lead')),
    board.state === 'down'
      ? el('section', { class: 'panel' },
        el('p', { class: 'strong', role: 'status' }, t('board.down')),
        el('p', { class: 'meta' }, t('board.local')),
        el('div', { class: 'row' }, again))
      : el('div', { class: 'row' },
        board.state === 'up' ? el('a', { href: url, target: '_blank', rel: 'noopener noreferrer' }, t('board.open')) : null,
        again,
        el('span', { class: 'meta', role: 'status' }, board.state === 'up' ? t('board.running', { url }) : t('board.checking'))),
  ];
}

// ===== Links page =====
function renderLinks() {
  return [
    el('h1', null, t('nav.links')),
    el('p', { class: 'lead' }, t('links.lead')),
    el('ul', { class: 'list' }, SETTINGS.links.map((l) => el('li', { class: 'item' },
      el('span', { class: 'title' }, linkEl(l)),
      el('span', { class: 'path' }, l.href),
      l.note ? el('span', { class: 'desc' }, t(l.note)) : null))),
  ];
}

// ===== Start =====
function boot() {
  lang = store('localStorage').get('zdd.lang') === 'zh-HK' ? 'zh-HK' : 'en';
  applyTheme(store('localStorage').get('zdd.theme'));
  document.title = SETTINGS.name;
  $('brandName').textContent = SETTINGS.name;
  $('topName').textContent = SETTINGS.name;
  $('menuBtn').addEventListener('click', () => toggleMenu());
  $('nav').addEventListener('click', () => toggleMenu(false));
  $('langBtn').addEventListener('click', () => {
    lang = lang === 'en' ? 'zh-HK' : 'en';
    store('localStorage').set('zdd.lang', lang);
    renderAll();
  });
  $('themeBtn').addEventListener('click', () => {
    applyTheme({ system: 'light', light: 'dark', dark: 'system' }[theme]);
    store('localStorage').set('zdd.theme', theme);
    renderAll();
  });
  $('connectBtn').addEventListener('click', connectFolder);
  $('reconnectBtn').addEventListener('click', reconnectFolder);
  $('reloadBtn').addEventListener('click', () => loadFromFolder(true));
  $('message').addEventListener('click', () => say(''));
  $('fileQuestions').addEventListener('change', (e) => importFile(e.target, 'questions'));
  $('fileSnapshot').addEventListener('change', (e) => importFile(e.target, 'snapshot'));
  $('fileBackup').addEventListener('change', (e) => restoreBackup(e.target));
  window.addEventListener('hashchange', () => { readRoute(); toggleMenu(false); say(''); renderAll(); $('main').focus(); });
  // Agents add questions while the page is open: re-read the folder whenever Zack comes back.
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && state.dir) loadFromFolder(false); });
  readRoute();
  renderAll();
  restoreFolder();
}

if (typeof document !== 'undefined') boot();
</script>
